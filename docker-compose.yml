version: '3.8'

services:
  opencode-go-proxy:
    build: .
    container_name: opencode-go-to-codex-api
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - UPSTREAM_BASE_URL=${UPSTREAM_BASE_URL:-https://opencode.ai/zen/go}
      - OPENCODE_TOKEN=${OPENCODE_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
